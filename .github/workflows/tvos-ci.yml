name: tvOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcodebuild -version >/dev/null 2>&1 && \
            ls -d /Applications/Xcode*.app/Contents/Developer | sort -V | tail -1)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Pick an Apple TV simulator
        id: sim
        run: |
          set -eo pipefail
          # Prefer "Apple TV 4K (3rd generation)"; fall back to any tvOS sim.
          NAME=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devs=json.load(sys.stdin)["devices"]; flat=[d["name"] for r,arr in devs.items() for d in arr if "tvOS" in r and d.get("isAvailable",True)]; pref=[n for n in flat if "4K" in n]; print(pref[0] if pref else (flat[0] if flat else ""))')
          if [ -z "$NAME" ]; then
            echo "::error::no Apple TV simulator available on this runner"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project FifiRecipesTV.xcodeproj \
            -scheme FifiRecipesTV \
            -destination "platform=tvOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FifiRecipesTV.xcodeproj \
            -scheme FifiRecipesTV \
            -destination "platform=tvOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:FifiRecipesTVTests \
            CODE_SIGNING_ALLOWED=NO

      - name: UI smoke tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FifiRecipesTV.xcodeproj \
            -scheme FifiRecipesTV \
            -destination "platform=tvOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:FifiRecipesTVUITests/FifiRecipesTVUITests \
            -resultBundlePath ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload UI test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: ui-tests.xcresult
          retention-days: 7
