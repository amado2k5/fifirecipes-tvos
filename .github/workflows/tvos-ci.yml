name: tvOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcodebuild -version >/dev/null 2>&1 && \
            ls -d /Applications/Xcode*.app/Contents/Developer | sort -V | tail -1)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Pick an Apple TV simulator
        id: sim
        run: |
          set -eo pipefail
          # Prefer "Apple TV 4K (3rd generation)"; fall back to any tvOS sim.
          NAME=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devs=json.load(sys.stdin)["devices"]; flat=[d for r,arr in devs.items() for d in arr if "tvOS" in r and d.get("isAvailable",True)]; pref=[d for d in flat if "4K" in d["name"]]; d=(pref or flat or [None])[0]; print(d["udid"]+" "+d["name"] if d else "")')
          if [ -z "$NAME" ]; then
            echo "::error::no Apple TV simulator available on this runner"
            exit 1
          fi
          echo "id=${NAME%% *}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${NAME#* }"

      # A cold simulator can take longer than XCUITest's 60s app-launch
      # timeout, failing whichever UI test runs first — boot it and wait.
      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.id }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.id }}" -b

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project FifiRecipesTV.xcodeproj \
            -scheme FifiRecipesTV \
            -destination "platform=tvOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FifiRecipesTV.xcodeproj \
            -scheme FifiRecipesTV \
            -destination "platform=tvOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -only-testing:FifiRecipesTVTests \
            -resultBundlePath unit-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: UI smoke tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FifiRecipesTV.xcodeproj \
            -scheme FifiRecipesTV \
            -destination "platform=tvOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -only-testing:FifiRecipesTVUITests/FifiRecipesTVUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Raw job logs and artifacts aren't always reachable, so surface the
      # failing test names and messages as annotations on the run.
      - name: Annotate failing tests
        if: failure()
        run: python3 scripts/ci-annotate-failures.py $(ls -d unit-tests.xcresult ui-tests.xcresult 2>/dev/null)

      - name: Upload UI test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: ui-tests.xcresult
          retention-days: 7
